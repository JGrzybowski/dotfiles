---
- name: Audio Equalization and Calibration (EasyEffects + AutoEQ)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: 1. Install EasyEffects via Pacman
      become: true
      community.general.pacman:
        name: easyeffects
        state: present

    - name: 2. Prepare AutoEQ impulse response folder (EasyEffects)
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/easyeffects/irs"
        state: directory
        mode: '0755'

