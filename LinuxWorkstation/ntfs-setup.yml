---
- name: Hardware specific setup - Multiple NTFS Drives
  hosts: localhost
  connection: local

  # Define the list of your drives. You can add as many as you need here.
  vars:
    ntfs_drives:
      - { uuid: "11111111-1111-1111-1111-111111111111", path: "/mnt/Data_1" }
      - { uuid: "22222222-2222-2222-2222-222222222222", path: "/mnt/Data_2" }
      - { uuid: "33333333-3333-3333-3333-333333333333", path: "/mnt/Archive" }

  tasks:
    - name: 1. Prepare mount points for all NTFS Drives
      become: true
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: '0755'
      # Execute this task for each item in the ntfs_drives list
      loop: "{{ ntfs_drives }}"

    - name: 2. Auto-mount NTFS drives in /etc/fstab
      become: true
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "UUID={{ item.uuid }}"
        fstype: ntfs3
        # Required options for proper Linux permissions on NTFS
        opts: defaults,uid=1000,gid=1000,umask=022
        state: mounted
      # Execute this task for each item in the ntfs_drives list
      loop: "{{ ntfs_drives }}"